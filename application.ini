[project]
    # DO NOT EDIT PROJECT SETTINGS
    name = label-studio
    protocol = http
    project_type = service
    service_kind = prototype

[defaults]
    # health check
    health_check_protocol = HTTP
    health_check_path = /health/
    health_check_interval = 30
    health_check_timeout = 10
    health_check_unhealthy_threshold = 3
    health_check_healthy_threshold = 2
    grace_period = 60

    # deploy settings
    max_percent = 200
    min_healthy_percent = 50

    # load balancer settings
    elb_connection_draining = 60
    elb_idle_timeout = 120

    # label studio uploads task files (images, audio, JSON)
    prototype_client_max_body_size = 50m

[local]
    port = 8080
    mem = 1024
    health_check_path = /health/

    env:DJANGO_DB = sqlite
    env:SKIP_DB_MIGRATIONS = false
    env:LOG_DIR = tmp

[production]
    min_count = 1
    max_count = 2
    cpu = 1.0
    mem = 2048
    nofile = 2048
    network = bridge

    # prototype: require Okta login (Thumbtack employees only)
    prototype_auth_required = true
    prototype_auth_type = okta

    env:POSTGRE_HOST = <rds-prod-endpoint>
    env:POSTGRE_NAME = labelstudio
    env:POSTGRE_USER = labelstudio_master_write
    env:LOG_DIR = /label-studio/data/logs
